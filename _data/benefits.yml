benefits:
  - title:
      ar: "التحليلات المتقدمة"
      en: "Advanced Analytics"
    description:
      ar: "استخدام أدوات تحليلية متقدمة لاستخراج الرؤى ودعم اتخاذ القرارات الاستراتيجية"
      en: "Use advanced analytics tools to extract insights and support strategic decision-making"
    image: "images/benefits/Benefit 1.png"

  - title:
      ar: "الأرشفة الرقمية"
      en: "Digital Archiving"
    description:
      ar: "حفظ الوثائق والمستندات إلكترونيًا لضمان سهولة الوصول والأمان"
      en: "Store and manage documents digitally for easy access and security"
    image: "images/benefits/Benefit 2.png"

  - title:
      ar: "إدارة الأدوار والصلاحيات"
      en: "Role-Based Access Control"
    description:
      ar: "تحديد الأدوار والصلاحيات للمستخدمين المختلفين لحماية البيانات الحساسة وضمان التحكم الكامل في الوصول"
      en: "Define roles and permissions for different users to protect sensitive data and ensure full access control"
    image: "images/benefits/Benefit 3.png"

  - title:
      ar: "دعم متعدد اللغات"
      en: "Multilingual Support"
    description:
      ar: "دعم واجهة المستخدم بلغات متعددة لتسهيل الاستخدام"
      en: "Multilingual UI support to facilitate diverse usage"
    image: "images/benefits/Benefit 4.png"

  - title:
      ar: "تقارير مالية مفصلة"
      en: "Financial Reporting"
    description:
      ar: "تقارير مالية مفصلة تُظهر تكلفة الرواتب، المكافآت، والتحليلات المتعلقة بها"
      en: "Detailed financial reports that display salary costs, bonuses, and related analytics"
    image: "images/benefits/Benefit 5.png"

  - title:
      ar: "تحليلات القوى العاملة"
      en: "Workforce Analytics"
    description:
      ar: "تحليل التوظيف، الدوران الوظيفي، ومستويات الأداء لفهم اتجاهات القوى العاملة"
      en: "Analyze hiring, turnover, and performance levels to understand workforce trends"
    image: "images/benefits/Benefit 6.png"

  - title:
      ar: "التوافق مع جميع الأجهزة"
      en: "All-Device Friendly Interface"
    description:
      ar: "واجهة استخدام متجاوبة تتيح الوصول السهل والسريع عبر الهواتف الذكية والأجهزة اللوحية والحاسوب"
      en: "A responsive interface that allows easy and fast access from smartphones, tablets and computers"
    image: "images/benefits/Benefit 7.png"

  - title:
      ar: "الإشعارات والتنبيهات الذكية"
      en: "Smart Alerts & Notifications"
    description:
      ar: "تنبيهات تلقائية للحضور، الإجازات، المستندات الناقصة أو المهام المتأخرة"
      en: "Automated alerts for attendance, leaves, missing documents, or overdue tasks"
    image: "images/benefits/Benefit 8.png"