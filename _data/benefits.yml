benefits:
  - title:
      ar: "إدارة الأدوار والصلاحيات"
      en: "Role-Based Access Control"
      description:
      ar: "تحديد الأدوار والصلاحيات للمستخدمين المختلفين لحماية البيانات الحساسة وضمان التحكم الكامل في الوصول."
      en: "Define roles and permissions for different users to protect sensitive data and ensure full access control."
      image: "images/benefits/Benefit 9.png"

  - title:
      ar: "التقارير المالية"
      en: "Financial Reporting"
      description:
      ar: "تقارير مالية دقيقة توضح تكاليف الرواتب والمكافآت والتحليلات اللازمة لدعم اتخاذ القرارات."
      en: "Accurate financial reports showing salary costs, bonuses, and analytics to support decision-making."
      image: "images/benefits/Benefit 10.png"

  - title:
      ar: "إدارة التوظيف"
      en: "Recruitment Management"
      description:
      ar: "متابعة عملية التوظيف بالكامل من الإعلان إلى التعيين، مع تتبع المرشحين وتقييمهم."
      en: "Manage the full recruitment process from job posting to hiring, with candidate tracking and evaluation."
      image: "images/benefits/Benefit 11.png"

  - title:
      ar: "إدارة التدريب والتطوير"
      en: "Training & Development"
      description:
      ar: "تتبع البرامج التدريبية، تقييم فعاليتها، ودعم تطوير مهارات الموظفين."
      en: "Track training programs, evaluate their effectiveness, and support employee skill development."
      image: "images/benefits/Benefit 12.png"

  - title:
      ar: "التحليلات المتقدمة"
      en: "Advanced Analytics"
      description:
      ar: "استخدام أدوات تحليلية متقدمة لاستخراج الرؤى ودعم اتخاذ القرارات الاستراتيجية."
      en: "Use advanced analytics tools to extract insights and support strategic decision-making."
      image: "images/benefits/Benefit 13.png"

  - title:
      ar: "الإشعارات والتنبيهات الذكية"
      en: "Smart Alerts & Notifications"
      description:
      ar: "تنبيهات تلقائية للحضور، الإجازات، المستندات الناقصة أو المهام المتأخرة."
      en: "Automated alerts for attendance, leaves, missing documents, or overdue tasks."
      image: "images/benefits/Benefit 14.png"

  - title:
      ar: "التوافق مع الأجهزة المحمولة"
      en: "Mobile-Friendly Interface"
      description:
      ar: "واجهة استخدام متجاوبة تتيح الوصول السهل والسريع عبر الهواتف الذكية والأجهزة اللوحية."
      en: "A responsive interface that allows easy and fast access from smartphones and tablets."
      image: "images/benefits/Benefit 15.png"

  - title:
      ar: "التكامل مع الأنظمة الأخرى"
      en: "System Integration"
      description:
      ar: "التكامل مع الأنظمة المحاسبية وأنظمة الموارد الأخرى لتسهيل تدفق المعلومات."
      en: "Integration with accounting systems and other enterprise tools to streamline data flow."
      image: "images/benefits/Benefit 16.png"

  - title:
      ar: "تحليلات القوى العاملة"
      en: "Workforce Analytics"
      description:
      ar: "تحليل التوظيف، الدوران الوظيفي، ومستويات الأداء لفهم اتجاهات القوى العاملة."
      en: "Analyze hiring, turnover, and performance levels to understand workforce trends."
      image: "images/benefits/Benefit 17.png"

  - title:
      ar: "تحليلات تنبؤية"
      en: "Predictive Analytics"
      description:
      ar: "التنبؤ بالاحتياجات المستقبلية للموارد البشرية بناءً على البيانات الحالية."
      en: "Predict future HR needs based on current data trends."
      image: "images/benefits/Benefit 18.png"